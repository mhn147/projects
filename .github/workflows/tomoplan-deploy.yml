name: Deploy TomoPlan

on:
  push:
    branches: [main]
    paths:
      - "tomoplan2/**"
      - ".github/workflows/tomoplan-deploy.yml"
  workflow_dispatch:

# Never run two deploys at once, and don't kill one mid-way.
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  DOTNET_VERSION: "10.0.x"
  # Path to your .csproj (or .sln) if it is not in the repo root
  PROJECT: "./TomoPlan.Web"
  TOMOPLAN_SERVER_USER: ${{ vars.TOMOPLAN_SERVER_USER }}
  APP_DIR: /var/www/plan
  SERVICE: plan

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore ${{ env.PROJECT }}

      # Uncomment if you have tests
      # - name: Test
      #   run: dotnet test ${{ env.PROJECT }} --no-restore -c Release

      - name: Publish
        run: dotnet publish ${{ env.PROJECT }} -c Release --no-restore -o ./publish

      - name: Configure SSH
        env:
          TOMOPLAN_SSH_PK: ${{ secrets.TOMOPLAN_SSH_PK }}
          TOMOPLAN_SSH_KNOWN_HOSTS: ${{ secrets.TOMOPLAN_SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$TOMOPLAN_SSH_PK" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$TOMOPLAN_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Upload files
        env:
          TOMOPLAN_SSH_HOST: ${{ secrets.TOMOPLAN_SSH_HOST }}
        run: |
          rsync -rlz --delete --chmod=D755,F644 \
            ./publish/ "${TOMOPLAN_SERVER_USER}@${TOMOPLAN_SSH_HOST}:${APP_DIR}/"

      - name: Restart service
        env:
          TOMOPLAN_SSH_HOST: ${{ secrets.TOMOPLAN_SSH_HOST }}
        run: |
          ssh "${TOMOPLAN_SERVER_USER}@${TOMOPLAN_SSH_HOST}" "sudo systemctl restart ${SERVICE} && sleep 2 && systemctl is-active ${SERVICE}"

      - name: Health check
        env:
          TOMOPLAN_SITE_URL: ${{ vars.TOMOPLAN_SITE_URL }}
        run: |
          curl -fsS -o /dev/null \
            --retry 10 --retry-delay 3 --retry-connrefused \
            "${TOMOPLAN_SITE_URL}"
